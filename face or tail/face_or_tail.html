<!DOCTYPE html>
<html>
<head>
  <title>Read and Display Text File</title>
  <style>
    *{
        margin: 0;
        padding: 0;
    }
    body{
        background: url("tt.jpeg");
        background-repeat:no-repeat ;
        background-position: center;
        background-size: cover;
    }
    button{
        border: 2px solid black;
        border-radius: 15px;
        background-color: rgb(58, 169, 192);
        width: 60px;
        height: 60px;
        font-size: 20px;
        margin-right: 20px;
    }
    button:hover{
        cursor: pointer;
        background-color: rgb(89, 192, 58);
    }
  </style>
</head>
<body>
  <h1 style="margin-left: 40%; color: white;" id = 'game'>ملك و كتابة</h1>
    <img id = 'pic' src = "what.png" width="150px" height="150px" style="margin-left: 45%; margin-top: 100px;">
    <br>
    <table id = "result" style="margin-left: 45%;">
        <thead>
            <tr>
                <th style="padding: 8px 10px; font-size: 30px; color: white;">win</th>
                <th style="padding: 8px 10px; font-size: 30px; color: white;">lose</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="padding: 8px 10px; font-size: 20px;color: white;" id = "win" >0</td>
                <td style="padding: 8px 20px; font-size: 20px;color: white;" id = "lose">0</td>
            </tr>
        </tbody>
    </table>
    <button onclick="play('face')" id = "p1" style="margin-left: 45%;">ملك</button>
    <button onclick="play('tail')" id = "p2">كتابة</button>

<script>
 let game = ["tail","face"];
 let index ;
 function play(guess){
    
    index = Math.floor(Math.random()*2);
    let win = Number(document.getElementById("win").textContent);
    let lose = Number(document.getElementById("lose").textContent);
    document.getElementById("pic").src = game[index] + ".jpeg";
    if (guess === game[index]){
        win+=1;
        document.getElementById("win").textContent = win;
    }
    else{
        lose+=1;
        document.getElementById("lose").textContent = lose;
    }
    document.getElementById("p1").disabled = true;
    document.getElementById("p2").disabled = true;
    
    setTimeout(() => {
    document.getElementById("p1").disabled = false;
    document.getElementById("p2").disabled = false;
    document.getElementById("pic").src = "what.png";
}, 1000);
    
 }
</script>
</body>
</html>
